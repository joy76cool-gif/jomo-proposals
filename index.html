<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>JOMO 提案</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+TC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--paper:#F5F1E8;--forest:#0E2620;--sunset:#E8884A;--rule:#d9d5cc}
*{margin:0;box-sizing:border-box}
body{background:var(--paper);color:var(--forest);font:16px/1.65 "Noto Sans TC",system-ui,sans-serif;min-height:100dvh;display:flex;align-items:center;justify-content:center}
.wrap{width:min(560px,100%);padding:56px 26px}
.eyb{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--forest);opacity:.6;display:flex;align-items:center;gap:9px;margin-bottom:14px}
.eyb::before{content:"";width:22px;height:1.5px;background:var(--sunset)}
h1{font-family:"DM Serif Display",serif;font-size:38px;font-weight:400;letter-spacing:-.01em;margin-bottom:6px}
.sub{opacity:.7;margin-bottom:30px;font-size:14px}
a.card{display:block;text-decoration:none;color:inherit;background:#fff;border:1px solid var(--rule);border-radius:14px;padding:20px 22px;margin-bottom:14px;transition:border-color .2s,transform .1s}
a.card:hover{border-color:var(--sunset);transform:translateY(-1px)}
a.card .t{font-weight:700;font-size:17px;margin-bottom:3px}
a.card .d{opacity:.7;font-size:13px}
a.card .go{color:var(--sunset);font-weight:700;font-size:13px;margin-top:8px;display:inline-block}
.foot{margin-top:24px;font-size:12px;opacity:.55;font-family:"JetBrains Mono",monospace}
</style>
<div class="wrap">
  <p class="eyb">JOMO · FLOW your business</p>
  <h1>提案</h1>
  <p class="sub">給客戶的提案頁,點進去看完整內容。</p>
  <a class="card" href="martin/"><div class="t">馬丁成長顧問</div><div class="d">Phase 1 MVP 系統化管理</div><span class="go">看提案 →</span></a>
  <a class="card" href="carquality/"><div class="t">車麗屋 momo 圖治理</div><div class="d">過期共用圖治理 提案 v3</div><span class="go">看提案 →</span></a>
  <div class="foot">jomopower.com</div>
</div>
</html>
